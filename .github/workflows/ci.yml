name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm test
      - run: >
          node --disable-warning=ExperimentalWarning --test --experimental-test-coverage
          --test-coverage-include='src/devis/**'
          --test-coverage-lines=80 --test-coverage-branches=80

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: |
          V=8.30.1
          URL=https://github.com/gitleaks/gitleaks/releases/download
          curl -sSfL "$URL/v$V/gitleaks_${V}_linux_x64.tar.gz" | tar xz -C /usr/local/bin gitleaks
      - run: gitleaks git -v --no-banner --redact --log-opts="HEAD" .

  revue-ia:
    if: github.event_name == 'pull_request'
    needs: [qualite, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Vérifier le jeton Copilot
        id: jeton
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          if [ -z "$COPILOT_GITHUB_TOKEN" ]; then
            echo "::notice::revue IA sautée"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout complet
        if: steps.jeton.outputs.present == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurer Node.js
        if: steps.jeton.outputs.present == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Installer GitHub Copilot CLI
        if: steps.jeton.outputs.present == 'true'
        run: npm install -g @github/copilot

      - name: Préparer le prompt avec le diff de la PR
        if: steps.jeton.outputs.present == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cp .github/prompts/revue-pr.txt "$RUNNER_TEMP/revue-pr.txt"
          printf '\n\n--- DIFF DE LA PULL REQUEST ---\n' >> "$RUNNER_TEMP/revue-pr.txt"
          git diff --no-ext-diff "$BASE_SHA...$HEAD_SHA" >> "$RUNNER_TEMP/revue-pr.txt"

      - name: Analyser la pull request
        if: steps.jeton.outputs.present == 'true'
        id: inference
        uses: actions/ai-inference@v3
        with:
          prompt-file: ${{ runner.temp }}/revue-pr.txt
          model: ''
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}

      - name: Publier la revue en commentaire
        if: steps.jeton.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RESPONSE_FILE: ${{ steps.inference.outputs.response-file }}
        run: gh pr comment "$PR_NUMBER" --body-file "$RESPONSE_FILE"
